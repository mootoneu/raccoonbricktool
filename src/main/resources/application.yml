server:
  # Bind to loopback by default: the API can trigger downloads and file writes and has no authentication.
  # Override with BRICKTOOLS_SERVER_ADDRESS only on a trusted network (or add authentication first).
  address: ${BRICKTOOLS_SERVER_ADDRESS:127.0.0.1}
  port: 8780

bricktools:
  data-dir: ./data
  rebrickable:
    download-url: https://cdn.rebrickable.com/media/downloads/all_downloads.zip
  brickwatch:
    base-url: https://www.brickwatch.net/fr-FR/set/
    min-delay-ms: 1000
  brickowl:
    base-url: https://api.brickowl.com/v1
    # Never commit the key. Set it in the environment that runs the application.
    api-key: ${BRICKOWL_API_KEY:}
